# BookShelf Sync Autostart Script
# This file MUST HAVE UNIX LINE BREAK (LF) and be placed in "/etc/upstart/"
# To activate: place an empty file named "ENABLE_BOOKSHELF_AUTOSTART" in /mnt/us/

start on framework_ready and started lab126_gui and started kppmainapp
stop on stopping system
task

script
    # Self-heal: restore the stock screensaver dir if the symlink is dangling
    # (its /mnt/us target was wiped by a factory reset). This conf lives on the
    # rootfs and runs at every boot, so it heals the lock screen even though the
    # OmniView extension itself was wiped from /mnt/us. No-op unless the symlink
    # is dangling AND our .bak exists.
    SS_TARGET="/usr/share/blanket/screensaver"
    if [ -L "$SS_TARGET" ] && [ ! -e "$SS_TARGET" ] && [ -d "$SS_TARGET.bak" ]; then
        /bin/mount -o remount,rw /dev/root / 2>/dev/null || /usr/sbin/mntroot rw 2>/dev/null
        /bin/rm -f "$SS_TARGET"
        /bin/mv "$SS_TARGET.bak" "$SS_TARGET"
        /bin/mount -o remount,ro /dev/root / 2>/dev/null || /usr/sbin/mntroot ro 2>/dev/null
    fi

    # Wait for app framework to be ready
    lipc-wait-event -s 90 com.lab126.appmgrd appStarted

    if [ $? -eq 0 ]; then
        # Run autostart if the binary exists and either feature is enabled
        # (screensaver wallpaper or bookshelf auto-sync — they are independent).
        if [ -f /mnt/us/extensions/OmniView/bin/omniview ] && { [ -f /mnt/us/OmniView/conf/ss_enabled ] || [ -f /mnt/us/ENABLE_BOOKSHELF_AUTOSTART ]; }; then
            # Execute autostart directly via Go binary
            exec /mnt/us/extensions/OmniView/bin/omniview -mode autostart -workdir /mnt/us/OmniView
        fi
    fi
end script
